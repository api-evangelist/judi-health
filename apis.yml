aid: judi-health
name: Judi Health
description: >-
  Judi Health (formerly Capital Rx) is a healthcare technology company delivering unified
  pharmacy and medical benefit administration. Its platform, Judi, is a modern claims and
  benefits processing system (a Core Administrative Processing System / CAPS) that self-funded
  employers, unions, health plans, third-party administrators (TPAs), brokers, and health
  systems use to run transparent, pass-through pharmacy benefit management (Judi Rx),
  integrated health benefit administration (Judi Care), care navigation, level-funded
  pharmacy benefits, a Medicare prescription payment plan, and white-label discount cards.
  Judi Cloud licenses the underlying platform to other administrators. In 2026 the company
  rebranded from Capital Rx to Judi Health following a $400M funding round to accelerate its
  AI-powered health benefits platform, and its PBM business surpassed five million contracted
  lives. Judi Health does not currently publish a public developer API, SDK, or API reference;
  this profile captures the company identity, web properties, and security/trust posture.
